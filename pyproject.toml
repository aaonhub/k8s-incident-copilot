[project]
name = "k8s-incident-copilot"
version = "0.1.0"
description = "A guarded, evaluated AI incident investigator for Kubernetes (demo on k3d, synthetic data)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "kubernetes>=30",
  "httpx>=0.27",
  "pydantic>=2.6",
  "numpy>=1.26",
  "fastembed>=0.4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
copilot = "copilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["copilot"]

[tool.ruff]
line-length = 125

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

{{- range $name, $c := .Values.components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "shop.labels" $ | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: shop
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.repository }}:{{ $c.imageTag | default $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: ROLE, value: {{ $name | quote }}}
            - {name: APP_VERSION, value: {{ $c.imageTag | default $.Values.image.tag | quote }}}
            {{- range $k, $v := $c.env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
            - name: API_KEY
              valueFrom:
                secretKeyRef: {name: {{ $c.secretName }}, key: value}
          readinessProbe:
            httpGet: {path: {{ $c.readinessPath }}, port: http}
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: {{ $c.livenessPath | default "/healthz" }}, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml $c.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "shop.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - {name: http, port: 8080, targetPort: http}
{{- end }}

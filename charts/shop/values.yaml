# Every incident in copilot/incidents.py is a change to one of these values (or a
# kubectl edit against the objects this chart renders). The defaults are healthy.
image:
  repository: incident-shop/app
  tag: "1.0.0"
  pullPolicy: IfNotPresent

components:
  webapp:
    replicas: 2
    imageTag: ""            # empty = image.tag
    readinessPath: /ready
    livenessPath: /healthz
    secretName: shop-api-credentials
    env:
      UPSTREAM_URL: http://inventory:8080/stock
      UPSTREAM_TIMEOUT_MS: "800"
      LOG_LEVEL: info
      CACHE_WARM_MB: "16"
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {cpu: 500m, memory: 128Mi}
  inventory:
    replicas: 1
    imageTag: ""
    readinessPath: /ready
    livenessPath: /healthz
    secretName: inventory-db-credentials
    env:
      FAULT_LATENCY_MS: "0"
      LOG_LEVEL: info
      CACHE_WARM_MB: "8"
    resources:
      requests: {cpu: 10m, memory: 48Mi}
      limits: {cpu: 300m, memory: 128Mi}

loadgen:
  enabled: true
  intervalS: "1.0"

secrets:
  # Demo-only placeholder values; nothing real is ever stored here.
  shop-api-credentials: demo-not-a-real-key
  inventory-db-credentials: demo-not-a-real-password
